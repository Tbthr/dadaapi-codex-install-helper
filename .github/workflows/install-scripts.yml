name: 验证哒哒助手 v1.0 安装脚本

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/install.ps1"
      - "scripts/install.sh"
      - ".github/workflows/install-scripts.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/install.ps1"
      - "scripts/install.sh"
      - ".github/workflows/install-scripts.yml"

permissions:
  contents: read

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - windows-latest
          - windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: 下载并校验 Windows 安装包
        shell: pwsh
        env:
          DADA_ASSISTANT_INSTALL_DRY_RUN: "1"
        run: ./scripts/install.ps1

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: 下载并校验 macOS 安装包
        env:
          DADA_ASSISTANT_INSTALL_DRY_RUN: "1"
        run: /bin/sh scripts/install.sh
