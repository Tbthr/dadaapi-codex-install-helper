name: Release desktop apps

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      # tauri-action updates the shared latest.json release asset. Keep the
      # matrix serialized so multiple targets cannot replace it concurrently.
      max-parallel: 1
      matrix:
        include:
          - platform: macos-14
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app,dmg
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundles: nsis
          - platform: windows-11-arm
            target: aarch64-pc-windows-msvc
            rust_targets: aarch64-pc-windows-msvc
            bundles: nsis

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WOCAO_HUB_ROUTE_MANIFEST_URLS: https://gitee.com/codeTrees/wocao-hub-routes/raw/main/public/manifest.json,https://raw.githubusercontent.com/ray7086/wocao-hub-routes/main/public/manifest.json
          WOCAO_HUB_ROUTE_PUBLIC_KEY_PEM: ${{ secrets.WOCAO_HUB_ROUTE_PUBLIC_KEY_PEM }}
          WOCAO_HUB_ROUTE_KEY_B64: ${{ secrets.WOCAO_HUB_ROUTE_KEY_B64 }}
          WOCAO_HUB_ROUTE_KEY_ID: v1
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Wocao Hub ${{ github.ref_name }}
          releaseBody: Wocao Hub 1.0 正式版。请根据设备平台下载对应安装包。
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

  checksums:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Download released installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release-assets
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "Wocao.Hub_*_arm64-setup.exe" \
            --pattern "Wocao.Hub_*_x64-setup.exe" \
            --pattern "Wocao.Hub_*_universal.dmg" \
            --dir release-assets

      - name: Publish SHA-256 checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release-assets
          sha256sum \
            Wocao.Hub_*_arm64-setup.exe \
            Wocao.Hub_*_x64-setup.exe \
            Wocao.Hub_*_universal.dmg \
            > checksums.txt
          gh release upload "$GITHUB_REF_NAME" checksums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  gitee-release:
    needs: checksums
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download complete GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release-assets
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets \
            --clobber

      - name: Prepare Gitee updater metadata
        run: |
          set -euo pipefail
          prefix="https://gitee.com/codeTrees/wocao-hub/releases/download/$GITHUB_REF_NAME/"
          jq --arg prefix "$prefix" '
            .platforms |= with_entries(
              .value.url = ($prefix + (.value.url | split("/") | last))
            )
          ' release-assets/latest.json > release-assets/latest.gitee.json
          mv release-assets/latest.gitee.json release-assets/latest.json

          dmg_file=$(find release-assets -maxdepth 1 -type f \
            -name 'Wocao.Hub_*_universal.dmg' -print -quit)
          test -n "$dmg_file"
          dmg_name=$(basename "$dmg_file")
          zip_name="$dmg_name.zip"
          (
            cd release-assets
            zip -q "$zip_name" "$dmg_name"
          )
          zip_checksum=$(sha256sum "release-assets/$zip_name" | awk '{print $1}')
          grep -v 'Wocao\.Hub_.*_universal\.dmg$' \
            release-assets/checksums.txt > release-assets/checksums.gitee.txt
          printf '%s  %s\n' "$zip_checksum" "$zip_name" \
            >> release-assets/checksums.gitee.txt
          mv release-assets/checksums.gitee.txt release-assets/checksums.txt
          rm "$dmg_file"

      - name: Replace Gitee release
        id: gitee_release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          api="https://gitee.com/api/v5/repos/codeTrees/wocao-hub/releases"
          existing=$(curl -fsS --connect-timeout 20 --max-time 60 \
            "$api/tags/$GITHUB_REF_NAME?access_token=$GITEE_TOKEN" || true)
          existing_id=$(printf '%s' "$existing" | jq -r '.id // empty')
          if [ -n "$existing_id" ]; then
            curl -fsS --connect-timeout 20 --max-time 60 \
              -X DELETE "$api/$existing_id?access_token=$GITEE_TOKEN" >/dev/null
          fi

          payload=$(jq -n \
            --arg token "$GITEE_TOKEN" \
            --arg tag "$GITHUB_REF_NAME" \
            --arg name "Wocao Hub $GITHUB_REF_NAME" \
            --arg body "Wocao Hub 1.0 国内发行版。Windows 可直接下载安装；macOS DMG 使用 ZIP 封装，建议执行仓库首页的一键安装命令。" \
            '{access_token:$token,tag_name:$tag,name:$name,body:$body,target_commitish:"main",prerelease:false}')
          response=$(curl -fsS --connect-timeout 20 --max-time 60 \
            -X POST \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$api")
          release_id=$(printf '%s' "$response" | jq -r '.id')
          test -n "$release_id"
          test "$release_id" != "null"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Upload Gitee release assets in parallel
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          RELEASE_ID: ${{ steps.gitee_release.outputs.release_id }}
        run: |
          set -euo pipefail
          api="https://gitee.com/api/v5/repos/codeTrees/wocao-hub/releases/$RELEASE_ID/attach_files"
          export api GITEE_TOKEN

          find release-assets -maxdepth 1 -type f -print0 | \
            xargs -0 -n 1 -P 4 bash -c '
              set -euo pipefail
              file="$1"
              for attempt in 1 2 3 4; do
                if curl -fsS \
                  --connect-timeout 30 \
                  --max-time 900 \
                  -X POST \
                  -F "access_token=$GITEE_TOKEN" \
                  -F "file=@$file" \
                  "$api" >/dev/null; then
                  printf "Uploaded %s\n" "$(basename "$file")"
                  exit 0
                fi
                printf "Retrying %s (%s/4)\n" "$(basename "$file")" "$attempt" >&2
                sleep $((attempt * 5))
              done
              printf "Upload failed: %s\n" "$(basename "$file")" >&2
              exit 1
            ' _

      - name: Verify uploaded asset list
        env:
          RELEASE_ID: ${{ steps.gitee_release.outputs.release_id }}
        run: |
          set -euo pipefail
          expected=$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')
          actual=$(curl -fsS --connect-timeout 20 --max-time 60 \
            "https://gitee.com/api/v5/repos/codeTrees/wocao-hub/releases/$RELEASE_ID/attach_files?per_page=100" \
            | jq 'length')
          test "$actual" -eq "$expected"

      - name: Publish domestic release metadata
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          mkdir -p release
          cp release-assets/latest.json release/latest.json
          git config user.name "wocao-hub-release[bot]"
          git config user.email "wocao-hub-release[bot]@users.noreply.github.com"
          git add release/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update domestic release metadata"
            git push origin main
          fi
          git remote add gitee "https://codeTrees:${GITEE_TOKEN}@gitee.com/codeTrees/wocao-hub.git"
          git push gitee main
          git push gitee "$GITHUB_REF_NAME" --force

      - name: Verify Gitee release downloads
        run: |
          while read -r checksum name; do
            url="https://gitee.com/codeTrees/wocao-hub/releases/download/$GITHUB_REF_NAME/$name"
            curl -fsSL \
              --connect-timeout 30 \
              --max-time 900 \
              --retry 3 \
              --retry-all-errors \
              "$url" \
              -o "/tmp/$name"
            printf '%s  %s\n' "$checksum" "/tmp/$name" | sha256sum --check
          done < release-assets/checksums.txt
