name: 发布哒哒助手 v1.0

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  preflight:
    name: 验证标签、候选验收与生产配置
    environment: production-release
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GITEE_REPOSITORY: ${{ vars.GITEE_REPOSITORY }}
      GITEE_USERNAME: ${{ vars.GITEE_USERNAME }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      RELEASE_ACCEPTANCE_RECORD_JSON: ${{ vars.RELEASE_ACCEPTANCE_RECORD_JSON }}
      DADAAPI_ROUTE_PUBLIC_KEY_PEM: ${{ secrets.DADAAPI_ROUTE_PUBLIC_KEY_PEM }}
      DADAAPI_ROUTE_KEY_B64: ${{ secrets.DADAAPI_ROUTE_KEY_B64 }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 验证版本、提交与签名标签
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          desktop_version=$(jq -r '.version // empty' apps/desktop/src-tauri/tauri.conf.json)
          package_version=$(jq -r '.version // empty' apps/desktop/package.json)
          root_package_version=$(jq -r '.version // empty' package.json)
          workspace_version=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '[.packages[].version] | unique | if length == 1 then .[0] else empty end')
          test -n "$desktop_version"
          test "$desktop_version" = "$package_version"
          test "$desktop_version" = "$root_package_version"
          test "$desktop_version" = "$workspace_version"
          test "$GITHUB_REF_NAME" = "v$desktop_version"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$main_sha" = "$GITHUB_SHA" || {
            echo "::error title=Release is not current main::The release tag must point to the accepted protected main commit."
            exit 1
          }

          tag_ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")
          tag_type=$(jq -r '.object.type' <<< "$tag_ref")
          tag_object_sha=$(jq -r '.object.sha' <<< "$tag_ref")
          test "$tag_type" = tag || {
            echo "::error title=Unsigned lightweight tag::Production releases require a signed annotated tag."
            exit 1
          }
          tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha")
          jq -e --arg tag "$GITHUB_REF_NAME" --arg commit "$GITHUB_SHA" '
            .tag == $tag and
            .object.type == "commit" and
            .object.sha == $commit and
            .verification.verified == true
          ' <<< "$tag_object" >/dev/null || {
            echo "::error title=Unverified release tag::GitHub must verify the annotated tag signature."
            exit 1
          }

      - name: 验证真实设备候选验收记录
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELEASE_ACCEPTANCE_RECORD_JSON" || {
            echo "::error title=Missing candidate acceptance::Set RELEASE_ACCEPTANCE_RECORD_JSON after all four real-device tests pass."
            exit 1
          }
          jq -e --arg version "$GITHUB_REF_NAME" --arg commit "$GITHUB_SHA" '
            .schemaVersion == 1 and
            .version == $version and
            .commit == $commit and
            (.candidateRunId | type == "number") and
            (.candidateRunId > 0) and
            (.acceptedBy | type == "string" and test("[^[:space:]]")) and
            (.acceptedAt | type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$") and fromdateiso8601 <= now) and
            ([.devices.macosIntel, .devices.macosAppleSilicon, .devices.windowsX64, .devices.windowsArm64] |
              all(.[];
                .install == true and
                .launch == true and
                .chatgptChinese == true and
                .legacyCodexChinese == true and
                .manualNetworkRecovery == true
              ))
          ' <<< "$RELEASE_ACCEPTANCE_RECORD_JSON" >/dev/null || {
            echo "::error title=Incomplete candidate acceptance::Every required real-device result must be explicitly true."
            exit 1
          }

          candidate_run_id=$(jq -r '.candidateRunId' <<< "$RELEASE_ACCEPTANCE_RECORD_JSON")
          candidate_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run_id")
          jq -e --arg commit "$GITHUB_SHA" '
            .event == "workflow_dispatch" and
            .head_sha == $commit and
            .conclusion == "success" and
            .path == ".github/workflows/signed-candidate.yml"
          ' <<< "$candidate_run" >/dev/null || {
            echo "::error title=Invalid candidate workflow::Acceptance must reference a successful signed-candidate run for this commit."
            exit 1
          }
          artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run_id/artifacts?per_page=100")
          jq -e '
            [.artifacts[] | select(.expired == false) | .name] as $names |
            ($names | length) == 4 and
            ($names | unique | length) == 4 and
            all(["candidate-macos-universal", "candidate-windows-x64", "candidate-windows-arm64", "candidate-manifest"][]; . as $name | $names | index($name))
          ' <<< "$artifacts" >/dev/null || {
            echo "::error title=Candidate artifacts unavailable::All signed candidate artifacts must still be present."
            exit 1
          }

      - name: 验证生产凭据和公开信任常量
        shell: bash
        run: |
          set -euo pipefail
          required=(
            GITEE_TOKEN
            DADAAPI_ROUTE_PUBLIC_KEY_PEM
            DADAAPI_ROUTE_KEY_B64
            APPLE_CERTIFICATE
            APPLE_CERTIFICATE_PASSWORD
            APPLE_API_KEY
            APPLE_API_ISSUER
            APPLE_API_KEY_BASE64
            WINDOWS_CERTIFICATE
            WINDOWS_CERTIFICATE_PASSWORD
            WINDOWS_TIMESTAMP_URL
          )
          missing=()
          for name in "${required[@]}"; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf '::error title=Missing production release configuration::Configure in production-release: %s\n' "${missing[*]}"
            exit 1
          fi
          [[ "$GITEE_REPOSITORY" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]]
          [ -z "$GITEE_USERNAME" ] || [[ "$GITEE_USERNAME" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$WINDOWS_TIMESTAMP_URL" =~ ^https://[^[:space:]@]+$ ]]

          team_id=$(jq -r '.macosTeamId // empty' release/trust-identities.json)
          bundle_id=$(jq -r '.macosBundleId // empty' release/trust-identities.json)
          publisher=$(jq -r '.windowsPublisherSubject // empty' release/trust-identities.json)
          [[ "$team_id" =~ ^[A-Z0-9]{10}$ ]]
          test "$team_id" != SET_BEFORE_V1_0_0
          test "$bundle_id" = com.dadaapi.assistant
          test -n "$publisher"
          test "$publisher" != SET_BEFORE_V1_0_0
          grep -F -x "expected_apple_team_id=\"$team_id\"" scripts/install.sh
          grep -F -x "expected_bundle_identifier=\"$bundle_id\"" scripts/install.sh
          grep -F -x "\$ExpectedWindowsPublisherSubject = \"$publisher\"" scripts/install.ps1

      - name: 拒绝覆盖两端最终 Release
        shell: bash
        run: |
          set -euo pipefail
          github_response="$RUNNER_TEMP/github-release.json"
          github_status=$(curl -sS --connect-timeout 20 --max-time 60 \
            -o "$github_response" -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME")
          case "$github_status" in
            404) ;;
            200)
              jq -e '.tag_name == env.GITHUB_REF_NAME and (.draft == true or .prerelease == true)' "$github_response" >/dev/null || {
                echo "::error title=Final GitHub release exists::Publish a new patch version; never replace final assets."
                exit 1
              }
              ;;
            *) exit 1 ;;
          esac

          gitee_response="$RUNNER_TEMP/gitee-release.json"
          gitee_status=$(curl -sS --connect-timeout 20 --max-time 60 \
            -o "$gitee_response" -w '%{http_code}' \
            -H "Authorization: token $GITEE_TOKEN" \
            "https://gitee.com/api/v5/repos/$GITEE_REPOSITORY/releases/tags/$GITHUB_REF_NAME")
          case "$gitee_status" in
            404) ;;
            200)
              jq -e '.tag_name == env.GITHUB_REF_NAME and .prerelease == true' "$gitee_response" >/dev/null || {
                echo "::error title=Final Gitee release exists::Publish a new patch version; never replace final assets."
                exit 1
              }
              ;;
            *) exit 1 ;;
          esac

  quality:
    name: 完整代码与安装脚本检查
    needs: preflight
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt,clippy
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: production-release-quality

      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: pnpm --dir apps/desktop check
      - run: pnpm --dir apps/desktop build
      - run: /bin/sh scripts/tests/install-sh-tests.sh
      - run: bash scripts/check-licenses.sh

  signed-build:
    name: 生产签名构建
    needs:
      - preflight
      - quality
    uses: ./.github/workflows/signed-build.yml
    with:
      commit_sha: ${{ github.sha }}
      artifact_prefix: release
      retention_days: 7
    secrets: inherit

  github-draft:
    name: 创建或验证 GitHub Draft
    needs: signed-build
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: 生成严格四资产契约
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          expected_version="${RELEASE_TAG#v}"
          x64="Dada-Assistant_${expected_version}_x64-setup.exe"
          arm64="Dada-Assistant_${expected_version}_arm64-setup.exe"
          macos="Dada-Assistant_${expected_version}_universal.dmg"
          test -f "$x64"
          test -f "$arm64"
          test -f "$macos"
          test "$(find . -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 3
          sha256sum "$x64" "$arm64" "$macos" > checksums.txt
          sha256sum --check checksums.txt
          test "$(wc -l < checksums.txt | tr -d ' ')" -eq 3

      - name: 创建或安全复用 Draft
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          response="$RUNNER_TEMP/github-release.json"
          status=$(curl -sS --connect-timeout 20 --max-time 60 \
            -o "$response" -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          if [ "$status" = 404 ]; then
            gh release create "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --prerelease \
              --title "哒哒助手 $RELEASE_TAG" \
              --notes "哒哒助手 $RELEASE_TAG 正式候选。仅包含三个签名安装包与 checksums.txt；完成两源安装门禁后自动转为正式版。"
          elif [ "$status" = 200 ] && jq -e '.tag_name == env.RELEASE_TAG and .draft == true' "$response" >/dev/null; then
            existing="$RUNNER_TEMP/existing-assets"
            mkdir "$existing"
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$existing"
            for existing_file in "$existing"/*; do
              name=$(basename "$existing_file")
              test -f "release-assets/$name" || {
                echo "Draft contains an unexpected asset: $name" >&2
                exit 1
              }
              cmp "$existing_file" "release-assets/$name" || {
                echo "Draft asset differs and will not be replaced: $name" >&2
                exit 1
              }
            done
            for local_file in release-assets/*; do
              name=$(basename "$local_file")
              [ -f "$existing/$name" ] || gh release upload "$RELEASE_TAG" "$local_file" --repo "$GITHUB_REPOSITORY"
            done
          else
            echo "Refusing to alter a non-draft GitHub release." >&2
            exit 1
          fi

          verified="$RUNNER_TEMP/github-draft.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$verified"
          jq -e '
            .tag_name == env.RELEASE_TAG and
            .draft == true and
            .prerelease == true and
            ([.assets[].name] | length) == 4 and
            ([.assets[].name] | unique | length) == 4 and
            ([.assets[].name | select(. == "checksums.txt")] | length == 1) and
            ([.assets[].name | select(endswith("_x64-setup.exe"))] | length == 1) and
            ([.assets[].name | select(endswith("_arm64-setup.exe"))] | length == 1) and
            ([.assets[].name | select(endswith("_universal.dmg"))] | length == 1)
          ' "$verified" >/dev/null

  github-prerelease:
    name: 公开 GitHub Prerelease
    needs: github-draft
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Draft 转为 Prerelease 并验证
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq 'select(.draft == false and .prerelease == true and (.assets | length) == 4) | .tag_name' \
            | grep -Fqx "$RELEASE_TAG"

  github-install-smoke:
    name: GitHub 版本化命令全安装
    needs: github-prerelease
    uses: ./.github/workflows/release-smoke.yml
    with:
      tag: ${{ github.ref_name }}
      source: github

  gitee-final:
    name: 同步并公开 Gitee Final
    needs: github-install-smoke
    environment: production-release
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GITEE_REPOSITORY: ${{ vars.GITEE_REPOSITORY }}
      GITEE_USERNAME: ${{ vars.GITEE_USERNAME }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_COMMIT: ${{ github.sha }}
      RELEASE_ASSETS_DIRECTORY: ${{ github.workspace }}/release-assets
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: 下载 GitHub Prerelease 四资产
        shell: bash
        run: |
          set -euo pipefail
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          jq -e '.tag_name == env.RELEASE_TAG and .draft == false and .prerelease == true and (.assets | length) == 4' <<< "$release" >/dev/null
          mkdir release-assets
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets

      - name: 同步、验真并公开 Gitee Release
        run: bash scripts/release/publish-gitee-release.sh

  gitee-install-smoke:
    name: Gitee 版本化命令全安装
    needs: gitee-final
    uses: ./.github/workflows/release-smoke.yml
    with:
      tag: ${{ github.ref_name }}
      source: gitee

  github-final:
    name: 公开 GitHub Final
    needs: gitee-install-smoke
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Prerelease 转为 Final 并验证
        shell: bash
        run: |
          set -euo pipefail
          before="$RUNNER_TEMP/before.json"
          after="$RUNNER_TEMP/after.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$before"
          jq -e '.draft == false and .prerelease == true and (.assets | length) == 4' "$before" >/dev/null
          jq -r '.assets[] | [.name, .size] | @tsv' "$before" | LC_ALL=C sort > "$RUNNER_TEMP/before-assets.tsv"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$after"
          jq -e '.draft == false and .prerelease == false and (.assets | length) == 4' "$after" >/dev/null
          jq -r '.assets[] | [.name, .size] | @tsv' "$after" | LC_ALL=C sort > "$RUNNER_TEMP/after-assets.tsv"
          diff -u "$RUNNER_TEMP/before-assets.tsv" "$RUNNER_TEMP/after-assets.tsv"

  latest-endpoints:
    name: 验证两源 latest 和资产一致性
    needs: github-final
    environment: production-release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GITEE_REPOSITORY: ${{ vars.GITEE_REPOSITORY }}
    steps:
      - name: 下载 latest 校验和并逐资产比对
        shell: bash
        run: |
          set -euo pipefail
          mkdir github gitee
          github_base="https://github.com/$GITHUB_REPOSITORY/releases/latest/download"
          github_latest=""
          for attempt in 1 2 3 4 5 6 7; do
            if github_latest=$(curl -fsSL --proto '=https' --proto-redir '=https' --max-redirs 5 \
              --connect-timeout 20 --max-time 60 \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest") \
              && jq -e --arg tag "$RELEASE_TAG" \
                '.tag_name == $tag and .draft == false and .prerelease == false' \
                <<< "$github_latest" >/dev/null; then
              break
            fi
            github_latest=""
            [ "$attempt" -eq 7 ] || sleep $((attempt * 5))
          done
          test -n "$github_latest"

          gitee_latest=""
          for attempt in 1 2 3 4 5 6 7; do
            if gitee_latest=$(curl -fsSL --proto '=https' --proto-redir '=https' --max-redirs 5 \
              --connect-timeout 20 --max-time 60 \
              "https://gitee.com/api/v5/repos/$GITEE_REPOSITORY/releases/latest") \
              && jq -e --arg tag "$RELEASE_TAG" \
                '.tag_name == $tag and .prerelease == false' \
                <<< "$gitee_latest" >/dev/null; then
              break
            fi
            gitee_latest=""
            [ "$attempt" -eq 7 ] || sleep $((attempt * 5))
          done
          test -n "$gitee_latest"
          gitee_latest_tag=$(jq -r '.tag_name // empty' <<< "$gitee_latest")
          gitee_base="https://gitee.com/$GITEE_REPOSITORY/releases/download/$gitee_latest_tag"

          download_with_retries() {
            url="$1"
            destination="$2"
            maximum_bytes="$3"
            maximum_time="$4"
            for attempt in 1 2 3 4; do
              rm -f "$destination"
              if curl -fsSL --proto '=https' --proto-redir '=https' --max-redirs 5 \
                --connect-timeout 30 --max-time "$maximum_time" --max-filesize "$maximum_bytes" \
                "$url" -o "$destination"; then
                return 0
              fi
              [ "$attempt" -eq 4 ] || sleep $((attempt * 5))
            done
            return 1
          }

          download_with_retries "$github_base/checksums.txt" github/checksums.txt 65536 60
          download_with_retries "$gitee_base/checksums.txt" gitee/checksums.txt 65536 60
          cmp github/checksums.txt gitee/checksums.txt
          test "$(wc -l < github/checksums.txt | tr -d ' ')" -eq 3
          expected_version="${RELEASE_TAG#v}"
          expected_names=$(printf '%s\n' \
            "Dada-Assistant_${expected_version}_x64-setup.exe" \
            "Dada-Assistant_${expected_version}_arm64-setup.exe" \
            "Dada-Assistant_${expected_version}_universal.dmg" | LC_ALL=C sort)
          actual_names=$(awk 'NF == 2 { print $2 }' github/checksums.txt | LC_ALL=C sort)
          test "$actual_names" = "$expected_names"
          while read -r checksum name extra; do
            test -z "${extra:-}"
            [[ "$checksum" =~ ^[0-9a-f]{64}$ ]]
            case "$name" in */*|*\\*|[-.]*) exit 1 ;; esac
            download_with_retries "$github_base/$name" "github/$name" 1073741824 900
            download_with_retries "$gitee_base/$name" "gitee/$name" 1073741824 900
            test "$(sha256sum "github/$name" | awk '{ print $1 }')" = "$checksum"
            test "$(sha256sum "gitee/$name" | awk '{ print $1 }')" = "$checksum"
            cmp "github/$name" "gitee/$name"
          done < github/checksums.txt
