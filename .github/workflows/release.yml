name: Release desktop apps

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      # tauri-action updates the shared latest.json release asset. Keep the
      # matrix serialized so multiple targets cannot replace it concurrently.
      max-parallel: 1
      matrix:
        include:
          - platform: macos-14
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app,dmg
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundles: nsis
          - platform: windows-11-arm
            target: aarch64-pc-windows-msvc
            rust_targets: aarch64-pc-windows-msvc
            bundles: nsis

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WOCAO_HUB_ROUTE_MANIFEST_URLS: https://gitee.com/codeTrees/wocao-hub-routes/raw/main/public/manifest.json,https://raw.githubusercontent.com/ray7086/wocao-hub-routes/main/public/manifest.json
          WOCAO_HUB_ROUTE_PUBLIC_KEY_PEM: ${{ secrets.WOCAO_HUB_ROUTE_PUBLIC_KEY_PEM }}
          WOCAO_HUB_ROUTE_KEY_B64: ${{ secrets.WOCAO_HUB_ROUTE_KEY_B64 }}
          WOCAO_HUB_ROUTE_KEY_ID: v1
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Wocao Hub ${{ github.ref_name }}
          releaseBody: Wocao Hub 1.0 正式版。请根据设备平台下载对应安装包。
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

  checksums:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Download released installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release-assets
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "Wocao.Hub_*_arm64-setup.exe" \
            --pattern "Wocao.Hub_*_x64-setup.exe" \
            --pattern "Wocao.Hub_*_universal.dmg" \
            --dir release-assets

      - name: Publish SHA-256 checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release-assets
          sha256sum \
            Wocao.Hub_*_arm64-setup.exe \
            Wocao.Hub_*_x64-setup.exe \
            Wocao.Hub_*_universal.dmg \
            > checksums.txt
          gh release upload "$GITHUB_REF_NAME" checksums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  gitee-release:
    needs: checksums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download complete GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release-assets
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets \
            --clobber

      - name: Prepare Gitee updater metadata
        run: |
          prefix="https://gitee.com/codeTrees/wocao-hub/releases/download/$GITHUB_REF_NAME/"
          jq --arg prefix "$prefix" '
            .platforms |= with_entries(
              .value.url = ($prefix + (.value.url | split("/") | last))
            )
          ' release-assets/latest.json > release-assets/latest.gitee.json
          mv release-assets/latest.gitee.json release-assets/latest.json

      - name: Replace Gitee release and upload assets
        id: gitee_release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          api="https://gitee.com/api/v5/repos/codeTrees/wocao-hub/releases"
          existing=$(curl -fsS "$api/tags/$GITHUB_REF_NAME?access_token=$GITEE_TOKEN" || true)
          existing_id=$(printf '%s' "$existing" | jq -r '.id // empty')
          if [ -n "$existing_id" ]; then
            curl -fsS -X DELETE "$api/$existing_id?access_token=$GITEE_TOKEN" >/dev/null
          fi

          payload=$(jq -n \
            --arg token "$GITEE_TOKEN" \
            --arg tag "$GITHUB_REF_NAME" \
            --arg name "Wocao Hub $GITHUB_REF_NAME" \
            --arg body "Wocao Hub 1.0 国内发行版。安装包与 GitHub Release 内容一致。" \
            '{access_token:$token,tag_name:$tag,name:$name,body:$body,target_commitish:"main",prerelease:false}')
          response=$(curl -fsS -X POST \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$api")
          release_id=$(printf '%s' "$response" | jq -r '.id')
          test -n "$release_id"
          test "$release_id" != "null"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

          for file in release-assets/*; do
            curl -fsS --retry 3 --retry-all-errors \
              -X POST \
              -F "access_token=$GITEE_TOKEN" \
              -F "file=@$file" \
              "$api/$release_id/attach_files" >/dev/null
          done

      - name: Publish domestic release metadata
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          mkdir -p release
          cp release-assets/latest.json release/latest.json
          cp release-assets/checksums.txt release/checksums.txt
          git config user.name "wocao-hub-release[bot]"
          git config user.email "wocao-hub-release[bot]@users.noreply.github.com"
          git add release/latest.json release/checksums.txt
          if ! git diff --cached --quiet; then
            git commit -m "Update domestic release metadata"
            git push origin main
          fi
          git remote add gitee "https://codeTrees:${GITEE_TOKEN}@gitee.com/codeTrees/wocao-hub.git"
          git push gitee main
          git push gitee "$GITHUB_REF_NAME" --force

      - name: Verify Gitee release downloads
        run: |
          while read -r checksum name; do
            url="https://gitee.com/codeTrees/wocao-hub/releases/download/$GITHUB_REF_NAME/$name"
            curl -fsSL --retry 3 --retry-all-errors "$url" -o "/tmp/$name"
            printf '%s  %s\n' "$checksum" "/tmp/$name" | sha256sum --check
          done < release-assets/checksums.txt
