name: 发布哒哒助手 v1.0

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # Each target writes assets to the same draft release.
      max-parallel: 1
      matrix:
        include:
          - platform: macos-14
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app,dmg
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundles: nsis
          - platform: windows-11-arm
            target: aarch64-pc-windows-msvc
            rust_targets: aarch64-pc-windows-msvc
            bundles: nsis

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DADAAPI_ROUTE_MANIFEST_URLS: https://gitee.com/lyq_power/dadaapi-routes/raw/main/public/manifest.json,https://raw.githubusercontent.com/Tbthr/dadaapi-routes/main/public/manifest.json
          DADAAPI_ROUTE_PUBLIC_KEY_PEM: ${{ secrets.DADAAPI_ROUTE_PUBLIC_KEY_PEM }}
          DADAAPI_ROUTE_KEY_B64: ${{ secrets.DADAAPI_ROUTE_KEY_B64 }}
          DADAAPI_ROUTE_KEY_ID: v1
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 哒哒助手 v1.0
          releaseBody: 哒哒助手 v1.0 正式版。请根据设备平台下载对应安装包。
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

  checksums:
    permissions:
      contents: write
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: 下载已发布安装包
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir release-assets
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "*_arm64-setup.exe" \
            --pattern "*_x64-setup.exe" \
            --pattern "*_universal.dmg" \
            --dir release-assets

      - name: 发布 SHA-256 校验和
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob
          arm64_installers=(*_arm64-setup.exe)
          x64_installers=(*_x64-setup.exe)
          universal_dmgs=(*_universal.dmg)
          test "${#arm64_installers[@]}" -eq 1
          test "${#x64_installers[@]}" -eq 1
          test "${#universal_dmgs[@]}" -eq 1
          sha256sum \
            "${arm64_installers[0]}" \
            "${x64_installers[0]}" \
            "${universal_dmgs[0]}" \
            > checksums.txt
          gh release upload "$GITHUB_REF_NAME" checksums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  gitee-release:
    permissions:
      contents: read
    needs: checksums
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITEE_REPOSITORY: ${{ vars.GITEE_REPOSITORY }}
      GITEE_USERNAME: ${{ vars.GITEE_USERNAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate Gitee release configuration
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GITEE_REPOSITORY" ]; then
            echo "::error title=Missing Gitee repository::Set the GITEE_REPOSITORY Actions variable to your Gitee owner/repository target."
            exit 1
          fi
          if ! [[ "$GITEE_REPOSITORY" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]]; then
            echo "::error title=Invalid Gitee repository::GITEE_REPOSITORY must use owner/repository format."
            exit 1
          fi
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::error title=Missing Gitee token::Add a GITEE_TOKEN Actions secret with write access to $GITEE_REPOSITORY."
            exit 1
          fi

      - name: Resolve GitHub release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          release_tag_object=$(git rev-parse --verify "refs/tags/$RELEASE_TAG")
          printf 'RELEASE_COMMIT=%s\n' "$release_commit" >> "$GITHUB_ENV"
          printf 'RELEASE_TAG_OBJECT=%s\n' "$release_tag_object" >> "$GITHUB_ENV"

      - name: Push release tag to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          export GITEE_USERNAME="${GITEE_USERNAME:-${GITEE_REPOSITORY%%/*}}"
          gitee_url="https://gitee.com/${GITEE_REPOSITORY}.git"
          askpass="$RUNNER_TEMP/dada-gitee-askpass.sh"
          umask 077
          cat > "$askpass" <<'EOF'
          #!/usr/bin/env sh
          case "$1" in
            *Username*) printf '%s\n' "$GITEE_USERNAME" ;;
            *) printf '%s\n' "$GITEE_TOKEN" ;;
          esac
          EOF
          chmod 700 "$askpass"
          trap 'rm -f "$askpass"' EXIT
          remote_tag_object=$(GIT_ASKPASS="$askpass" GIT_ASKPASS_REQUIRE=force GIT_TERMINAL_PROMPT=0 \
            git ls-remote "$gitee_url" "refs/tags/${RELEASE_TAG}" | awk 'NR == 1 { print $1 }')
          if [ -n "$remote_tag_object" ] && [ "$remote_tag_object" != "$RELEASE_TAG_OBJECT" ]; then
            GIT_ASKPASS="$askpass" GIT_ASKPASS_REQUIRE=force GIT_TERMINAL_PROMPT=0 git \
              push --force-with-lease="refs/tags/${RELEASE_TAG}:${remote_tag_object}" \
              "$gitee_url" "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          else
            GIT_ASKPASS="$askpass" GIT_ASKPASS_REQUIRE=force GIT_TERMINAL_PROMPT=0 git \
              push "$gitee_url" "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          fi
          synced_tag_object=$(GIT_ASKPASS="$askpass" GIT_ASKPASS_REQUIRE=force GIT_TERMINAL_PROMPT=0 \
            git ls-remote "$gitee_url" "refs/tags/${RELEASE_TAG}" | awk 'NR == 1 { print $1 }')
          test "$synced_tag_object" = "$RELEASE_TAG_OBJECT"

      - name: 下载完整 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release-assets
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets \
            --clobber

      - name: 准备 Gitee macOS 安装包
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob
          universal_dmgs=(*_universal.dmg)
          test "${#universal_dmgs[@]}" -eq 1
          dmg_name="${universal_dmgs[0]}"
          zip_name="$dmg_name.zip"
          zip -q "$zip_name" "$dmg_name"
          zip_checksum=$(sha256sum "$zip_name" | awk '{print $1}')
          grep -F -v "  $dmg_name" checksums.txt > checksums.gitee.txt
          printf '%s  %s\n' "$zip_checksum" "$zip_name" >> checksums.gitee.txt
          mv checksums.gitee.txt checksums.txt
          rm "$dmg_name"

      - name: 创建或替换 Gitee Release
        id: gitee_release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          api="https://gitee.com/api/v5/repos/${GITEE_REPOSITORY}/releases"
          existing=$(curl -fsS --connect-timeout 20 --max-time 60 \
            --url-query "access_token=$GITEE_TOKEN" \
            "$api/tags/$GITHUB_REF_NAME" || true)
          existing_id=$(printf '%s' "$existing" | jq -r '.id // empty')
          if [ -n "$existing_id" ]; then
            curl -fsS --connect-timeout 20 --max-time 60 \
              -X DELETE \
              --url-query "access_token=$GITEE_TOKEN" \
              "$api/$existing_id" >/dev/null
          fi

          response=$(curl -fsS --connect-timeout 20 --max-time 60 \
            -X POST \
            -F "access_token=$GITEE_TOKEN" \
            -F "tag_name=$GITHUB_REF_NAME" \
            -F "name=哒哒助手 v1.0" \
            -F "body=哒哒助手 v1.0 国内发行版。Windows 可直接下载安装；macOS 使用 ZIP 封装的 DMG，可执行仓库首页的一键安装命令。" \
            -F "target_commitish=$RELEASE_COMMIT" \
            -F "prerelease=false" \
            "$api")
          release_id=$(printf '%s' "$response" | jq -r '.id')
          test -n "$release_id"
          test "$release_id" != "null"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: 并行上传 Gitee Release 资产
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          RELEASE_ID: ${{ steps.gitee_release.outputs.release_id }}
        run: |
          set -euo pipefail
          api="https://gitee.com/api/v5/repos/${GITEE_REPOSITORY}/releases/$RELEASE_ID/attach_files"
          export api GITEE_TOKEN

          find release-assets -maxdepth 1 -type f -print0 | \
            xargs -0 -n 1 -P 4 bash -c '
              set -euo pipefail
              file="$1"
              for attempt in 1 2 3 4; do
                if curl -fsS \
                  --connect-timeout 30 \
                  --max-time 900 \
                  -X POST \
                  -F "access_token=$GITEE_TOKEN" \
                  -F "file=@$file" \
                  "$api" >/dev/null; then
                  printf "Uploaded %s\n" "$(basename "$file")"
                  exit 0
                fi
                printf "Retrying %s (%s/4)\n" "$(basename "$file")" "$attempt" >&2
                sleep $((attempt * 5))
              done
              printf "Upload failed: %s\n" "$(basename "$file")" >&2
              exit 1
            ' _

      - name: 验证 Gitee Release 资产列表
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          RELEASE_ID: ${{ steps.gitee_release.outputs.release_id }}
        run: |
          set -euo pipefail
          expected=$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')
          actual=$(curl -fsS --connect-timeout 20 --max-time 60 \
            --url-query "access_token=$GITEE_TOKEN" \
            --url-query "per_page=100" \
            "https://gitee.com/api/v5/repos/${GITEE_REPOSITORY}/releases/$RELEASE_ID/attach_files" \
            | jq 'length')
          test "$actual" -eq "$expected"

      - name: 验证 Gitee Release 下载
        run: |
          set -euo pipefail
          while read -r checksum name; do
            url="https://gitee.com/${GITEE_REPOSITORY}/releases/download/$GITHUB_REF_NAME/$name"
            curl -fsSL \
              --connect-timeout 30 \
              --max-time 900 \
              --retry 3 \
              --retry-all-errors \
              "$url" \
              -o "/tmp/$name"
            printf '%s  %s\n' "$checksum" "/tmp/$name" | sha256sum --check
          done < release-assets/checksums.txt
