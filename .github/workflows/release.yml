name: Release desktop apps

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      # tauri-action updates the shared latest.json release asset. Keep the
      # matrix serialized so multiple targets cannot replace it concurrently.
      max-parallel: 1
      matrix:
        include:
          - platform: macos-14
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app,dmg
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundles: nsis
          - platform: windows-11-arm
            target: aarch64-pc-windows-msvc
            rust_targets: aarch64-pc-windows-msvc
            bundles: nsis

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WOCAO_HUB_ROUTE_MANIFEST_URL: https://raw.githubusercontent.com/ray7086/wocao-hub-routes/main/public/manifest.json
          WOCAO_HUB_ROUTE_PUBLIC_KEY_PEM: ${{ secrets.WOCAO_HUB_ROUTE_PUBLIC_KEY_PEM }}
          WOCAO_HUB_ROUTE_KEY_B64: ${{ secrets.WOCAO_HUB_ROUTE_KEY_B64 }}
          WOCAO_HUB_ROUTE_KEY_ID: v1
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Wocao Hub ${{ github.ref_name }}
          releaseBody: Wocao Hub 1.0 正式版。请根据设备平台下载对应安装包。
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

  checksums:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Download released installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release-assets
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "Wocao.Hub_*_arm64-setup.exe" \
            --pattern "Wocao.Hub_*_x64-setup.exe" \
            --pattern "Wocao.Hub_*_universal.dmg" \
            --dir release-assets

      - name: Publish SHA-256 checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release-assets
          sha256sum \
            Wocao.Hub_*_arm64-setup.exe \
            Wocao.Hub_*_x64-setup.exe \
            Wocao.Hub_*_universal.dmg \
            > checksums.txt
          gh release upload "$GITHUB_REF_NAME" checksums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
