name: Refresh ChatGPT MSIX links

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: msix-links

      - name: Resolve Microsoft Store packages
        shell: bash
        run: |
          set -euo pipefail
          max_attempts=3
          resolver_status=1

          for attempt in $(seq 1 "$max_attempts"); do
            if cargo run --release -p msix-links -- /tmp/msix-links/msix-links.json; then
              exit 0
            else
              resolver_status=$?
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Microsoft Store package resolution failed after $max_attempts attempts." >&2
              exit "$resolver_status"
            fi

            delay_seconds=$((attempt * 10))
            echo "Microsoft Store package resolution failed (attempt $attempt/$max_attempts); retrying in $delay_seconds seconds." >&2
            sleep "$delay_seconds"
          done

      - name: Publish current links
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: msix-links
          publish_dir: /tmp/msix-links
          force_orphan: true
          enable_jekyll: true
          commit_message: Refresh ChatGPT MSIX links
