name: Refresh ChatGPT MSIX links

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: msix-links

      - name: Resolve Microsoft Store packages
        run: cargo run --release -p msix-links -- /tmp/msix-links/msix-links.json

      - name: Publish current links
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: msix-links
          publish_dir: /tmp/msix-links
          force_orphan: true
          enable_jekyll: true
          commit_message: Refresh ChatGPT MSIX links
