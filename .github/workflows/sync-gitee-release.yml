name: 同步哒哒助手 v1.0 发布

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag to sync
        required: true
        default: v1.0.0

permissions:
  contents: write

concurrency:
  group: sync-gitee-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 下载完整 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir release-assets
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets \
            --clobber

      - name: 准备 Gitee macOS 安装包
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob
          universal_dmgs=(*_universal.dmg)
          test "${#universal_dmgs[@]}" -eq 1
          dmg_name="${universal_dmgs[0]}"
          zip_name="$dmg_name.zip"
          zip -q "$zip_name" "$dmg_name"
          zip_checksum=$(sha256sum "$zip_name" | awk '{print $1}')
          grep -F -v "  $dmg_name" checksums.txt > checksums.gitee.txt
          printf '%s  %s\n' "$zip_checksum" "$zip_name" >> checksums.gitee.txt
          mv checksums.gitee.txt checksums.txt
          rm "$dmg_name"

      - name: 创建或替换 Gitee Release
        id: gitee_release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          api="https://gitee.com/api/v5/repos/codeTrees/wocao-hub/releases"
          existing=$(curl -fsS --connect-timeout 20 --max-time 60 \
            "$api/tags/$RELEASE_TAG?access_token=$GITEE_TOKEN" || true)
          existing_id=$(printf '%s' "$existing" | jq -r '.id // empty')
          if [ -n "$existing_id" ]; then
            curl -fsS --connect-timeout 20 --max-time 60 \
              -X DELETE "$api/$existing_id?access_token=$GITEE_TOKEN" >/dev/null
          fi

          payload=$(jq -n \
            --arg token "$GITEE_TOKEN" \
            --arg tag "$RELEASE_TAG" \
            --arg name "哒哒助手 v1.0" \
            --arg body "哒哒助手 v1.0 国内发行版。Windows 可直接下载安装；macOS 使用 ZIP 封装的 DMG，可执行仓库首页的一键安装命令。" \
            '{access_token:$token,tag_name:$tag,name:$name,body:$body,target_commitish:"main",prerelease:false}')
          response=$(curl -fsS --connect-timeout 20 --max-time 60 \
            -X POST \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$api")
          release_id=$(printf '%s' "$response" | jq -r '.id')
          test -n "$release_id"
          test "$release_id" != "null"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: 并行上传 Gitee Release 资产
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          RELEASE_ID: ${{ steps.gitee_release.outputs.release_id }}
        run: |
          set -euo pipefail
          api="https://gitee.com/api/v5/repos/codeTrees/wocao-hub/releases/$RELEASE_ID/attach_files"
          export api GITEE_TOKEN

          find release-assets -maxdepth 1 -type f -print0 | \
            xargs -0 -n 1 -P 4 bash -c '
              set -euo pipefail
              file="$1"
              for attempt in 1 2 3 4; do
                if curl -fsS \
                  --connect-timeout 30 \
                  --max-time 900 \
                  -X POST \
                  -F "access_token=$GITEE_TOKEN" \
                  -F "file=@$file" \
                  "$api" >/dev/null; then
                  printf "Uploaded %s\n" "$(basename "$file")"
                  exit 0
                fi
                printf "Retrying %s (%s/4)\n" "$(basename "$file")" "$attempt" >&2
                sleep $((attempt * 5))
              done
              printf "Upload failed: %s\n" "$(basename "$file")" >&2
              exit 1
            ' _

      - name: 验证 Gitee Release 资产列表
        env:
          RELEASE_ID: ${{ steps.gitee_release.outputs.release_id }}
        run: |
          set -euo pipefail
          expected=$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')
          actual=$(curl -fsS --connect-timeout 20 --max-time 60 \
            "https://gitee.com/api/v5/repos/codeTrees/wocao-hub/releases/$RELEASE_ID/attach_files?per_page=100" \
            | jq 'length')
          test "$actual" -eq "$expected"

      - name: 同步 Release 引用至 Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git remote add gitee "https://codeTrees:${GITEE_TOKEN}@gitee.com/codeTrees/wocao-hub.git"
          git push gitee main
          git push gitee "$RELEASE_TAG" --force

      - name: 验证 Gitee Release 下载
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          while read -r checksum name; do
            url="https://gitee.com/codeTrees/wocao-hub/releases/download/$RELEASE_TAG/$name"
            curl -fsSL \
              --connect-timeout 30 \
              --max-time 900 \
              --retry 3 \
              --retry-all-errors \
              "$url" \
              -o "/tmp/$name"
            printf '%s  %s\n' "$checksum" "/tmp/$name" | sha256sum --check
          done < release-assets/checksums.txt
