name: 可复用生产签名构建

on:
  workflow_call:
    inputs:
      commit_sha:
        description: Exact protected main commit to build
        required: true
        type: string
      artifact_prefix:
        description: Prefix for private Actions artifacts
        required: true
        type: string
      retention_days:
        description: Artifact retention in days
        required: true
        type: number

permissions:
  contents: read

jobs:
  build:
    name: 签名构建 (${{ matrix.target }})
    environment: production-release
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app,dmg
            release_config: src-tauri/tauri.release.conf.json
            artifact_suffix: macos-universal
            asset_architecture: universal
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundles: nsis
            release_config: src-tauri/tauri.release.windows.conf.json
            artifact_suffix: windows-x64
            asset_architecture: x64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            rust_targets: aarch64-pc-windows-msvc
            bundles: nsis
            release_config: src-tauri/tauri.release.windows.conf.json
            artifact_suffix: windows-arm64
            asset_architecture: arm64
    runs-on: ${{ matrix.runner }}
    env:
      DADAAPI_ROUTE_MANIFEST_URLS: https://gitee.com/lyq_power/dadaapi-routes/raw/main/public/manifest.json,https://raw.githubusercontent.com/Tbthr/dadaapi-routes/main/public/manifest.json
      DADAAPI_ROUTE_PUBLIC_KEY_PEM: ${{ secrets.DADAAPI_ROUTE_PUBLIC_KEY_PEM }}
      DADAAPI_ROUTE_KEY_B64: ${{ secrets.DADAAPI_ROUTE_KEY_B64 }}
      DADAAPI_ROUTE_KEY_ID: v1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false

      - name: 验证提交和公开信任标识
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.commit_sha }}"
          test "${{ inputs.commit_sha }}" = "$(git rev-parse HEAD^{commit})"
          test -n "$DADAAPI_ROUTE_PUBLIC_KEY_PEM" || {
            echo "::error title=Missing route signing key::DADAAPI_ROUTE_PUBLIC_KEY_PEM is required in production-release."
            exit 1
          }
          test -n "$DADAAPI_ROUTE_KEY_B64" || {
            echo "::error title=Missing route encryption key::DADAAPI_ROUTE_KEY_B64 is required in production-release."
            exit 1
          }

          team_id=$(jq -r '.macosTeamId // empty' release/trust-identities.json)
          bundle_id=$(jq -r '.macosBundleId // empty' release/trust-identities.json)
          publisher=$(jq -r '.windowsPublisherSubject // empty' release/trust-identities.json)
          test "$team_id" != SET_BEFORE_V1_0_0
          test "$publisher" != SET_BEFORE_V1_0_0
          [[ "$team_id" =~ ^[A-Z0-9]{10}$ ]]
          test "$bundle_id" = com.dadaapi.assistant
          test -n "$publisher"
          test "$bundle_id" = "$(jq -r '.identifier' apps/desktop/src-tauri/tauri.conf.json)"
          grep -F -x "expected_apple_team_id=\"$team_id\"" scripts/install.sh
          grep -F -x "expected_bundle_identifier=\"$bundle_id\"" scripts/install.sh
          grep -F -x "\$ExpectedWindowsPublisherSubject = \"$publisher\"" scripts/install.ps1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: signed-${{ matrix.target }}

      - name: 安装锁定依赖
        run: pnpm install --frozen-lockfile

      - name: 导入 Apple Developer ID 与公证凭据
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          required=(APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_BASE64)
          for name in "${required[@]}"; do
            test -n "${!name}" || {
              echo "::error title=Missing Apple release secret::$name is required in the production-release environment."
              exit 1
            }
          done

          decode_base64() {
            if base64 --help 2>&1 | grep -q -- '--decode'; then
              base64 --decode
            else
              base64 -D
            fi
          }

          certificate_path="$RUNNER_TEMP/dada-release-certificate.p12"
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          keychain_path="$RUNNER_TEMP/dada-release-signing.keychain-db"
          keychain_password=$(openssl rand -base64 48)
          original_keychains="$RUNNER_TEMP/dada-release-original-keychains.txt"
          original_default_keychain="$RUNNER_TEMP/dada-release-original-default-keychain.txt"
          umask 077
          printf '%s' "$APPLE_CERTIFICATE" | decode_base64 > "$certificate_path"
          printf '%s' "$APPLE_API_KEY_BASE64" | decode_base64 > "$api_key_path"
          chmod 600 "$certificate_path" "$api_key_path"

          openssl pkcs12 -in "$certificate_path" -passin "pass:$APPLE_CERTIFICATE_PASSWORD" -noout
          openssl pkey -in "$api_key_path" -noout
          security list-keychains -d user > "$original_keychains"
          security default-keychain -d user > "$original_default_keychain"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productbuild \
            -T /usr/bin/productsign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"

          signing_identity=$(security find-identity -v -p codesigning "$keychain_path" \
            | sed -nE 's/.*"(Developer ID Application: [^"]+)".*/\1/p')
          test "$(printf '%s\n' "$signing_identity" | sed '/^$/d' | wc -l | tr -d ' ')" = 1
          printf 'APPLE_API_KEY_PATH=%s\n' "$api_key_path" >> "$GITHUB_ENV"
          printf 'APPLE_API_KEY=%s\n' "$APPLE_API_KEY" >> "$GITHUB_ENV"
          printf 'APPLE_API_ISSUER=%s\n' "$APPLE_API_ISSUER" >> "$GITHUB_ENV"
          printf 'APPLE_SIGNING_IDENTITY=%s\n' "$signing_identity" >> "$GITHUB_ENV"

      - name: 导入 Windows Authenticode 凭据
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($name in @("WINDOWS_CERTIFICATE", "WINDOWS_CERTIFICATE_PASSWORD", "WINDOWS_TIMESTAMP_URL")) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "Env:$name").Value)) {
              throw "$name is required in the production-release environment."
            }
          }

          $expectedPublisher = (Get-Content "release/trust-identities.json" -Raw | ConvertFrom-Json).windowsPublisherSubject
          $certificateDirectory = Join-Path $env:RUNNER_TEMP "dada-release-signing"
          $encodedCertificate = Join-Path $certificateDirectory "certificate.txt"
          $certificatePath = Join-Path $certificateDirectory "certificate.pfx"
          $releaseConfig = Join-Path $env:GITHUB_WORKSPACE "apps/desktop/src-tauri/tauri.release.windows.conf.json"
          New-Item -ItemType Directory -Force -Path $certificateDirectory | Out-Null
          [IO.File]::WriteAllText($encodedCertificate, $env:WINDOWS_CERTIFICATE)
          & certutil.exe -f -decode $encodedCertificate $certificatePath | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Unable to decode WINDOWS_CERTIFICATE." }

          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $imported = @(Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation "Cert:\CurrentUser\My" -Password $password)
          Remove-Item -LiteralPath $certificateDirectory -Recurse -Force
          $codeSigningOid = "1.3.6.1.5.5.7.3.3"
          $certificates = @($imported | Where-Object {
            $_.HasPrivateKey -and
            ($_.EnhancedKeyUsageList.ObjectId.Value -contains $codeSigningOid) -and
            $_.NotAfter -gt (Get-Date).AddDays(30)
          })
          if ($certificates.Count -ne 1) {
            throw "WINDOWS_CERTIFICATE must contain exactly one unexpired code-signing certificate."
          }
          if ($certificates[0].Subject -cne $expectedPublisher) {
            throw "Windows signing certificate Subject does not match release/trust-identities.json."
          }

          $timestampUri = [Uri]$env:WINDOWS_TIMESTAMP_URL
          if ($timestampUri.Scheme -cne "https" -or $timestampUri.UserInfo) {
            throw "WINDOWS_TIMESTAMP_URL must be an HTTPS URL without embedded credentials."
          }
          $thumbprint = ($certificates[0].Thumbprint -replace "\s", "").ToUpperInvariant()
          if ($thumbprint -notmatch "^[0-9A-F]{40}$") { throw "Invalid signing certificate thumbprint." }
          @{
            bundle = @{
              windows = @{
                certificateThumbprint = $thumbprint
                digestAlgorithm = "sha256"
                timestampUrl = $timestampUri.AbsoluteUri
                tsp = $true
              }
            }
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $releaseConfig -Encoding utf8
          "WINDOWS_SIGNING_THUMBPRINT=$thumbprint" | Add-Content -Path $env:GITHUB_ENV

      - name: 构建签名安装包
        run: >-
          pnpm --dir apps/desktop tauri build
          --config ${{ matrix.release_config }}
          --target ${{ matrix.target }}
          --bundles ${{ matrix.bundles }}

      - name: 验证并暂存 macOS Universal DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          applications=(target/universal-apple-darwin/release/bundle/macos/*.app)
          disk_images=(target/universal-apple-darwin/release/bundle/dmg/*_universal.dmg)
          test "${#applications[@]}" -eq 1
          test "${#disk_images[@]}" -eq 1
          team_id=$(jq -r '.macosTeamId' release/trust-identities.json)
          bundle_id=$(jq -r '.macosBundleId' release/trust-identities.json)

          codesign --verify --deep --strict --verbose=2 "${applications[0]}"
          codesign_details=$(codesign -dv --verbose=4 "${applications[0]}" 2>&1)
          printf '%s\n' "$codesign_details" | grep -Fqx "Authority=$APPLE_SIGNING_IDENTITY"
          printf '%s\n' "$codesign_details" | grep -Fqx "TeamIdentifier=$team_id"
          printf '%s\n' "$codesign_details" | grep -Fqx "Identifier=$bundle_id"
          ! printf '%s\n' "$codesign_details" | grep -q '^Signature=adhoc$'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${applications[0]}/Contents/Info.plist")" = "$bundle_id"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${applications[0]}/Contents/Info.plist")
          architectures=$(lipo -archs "${applications[0]}/Contents/MacOS/$executable")
          [[ " $architectures " == *" arm64 "* ]]
          [[ " $architectures " == *" x86_64 "* ]]
          hdiutil verify "${disk_images[0]}"
          xcrun stapler validate "${applications[0]}"
          spctl --assess --type execute --verbose=4 "${applications[0]}"

          mkdir signed-assets
          version=$(jq -r '.version' apps/desktop/src-tauri/tauri.conf.json)
          cp "${disk_images[0]}" "signed-assets/Dada-Assistant_${version}_universal.dmg"

      - name: 验证并暂存 Windows 安装器
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installers = @(Get-ChildItem "target/${{ matrix.target }}/release/bundle/nsis" -Filter "*.exe" -File)
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer." }
          $expectedPublisher = (Get-Content "release/trust-identities.json" -Raw | ConvertFrom-Json).windowsPublisherSubject
          $env:DADA_ASSISTANT_INSTALL_LIBRARY_ONLY = "1"
          . "scripts/install.ps1"
          Assert-WindowsInstallerSignature -Path $installers[0].FullName -ExpectedPublisherSubject $expectedPublisher
          $signature = Get-AuthenticodeSignature -LiteralPath $installers[0].FullName
          $thumbprint = ($signature.SignerCertificate.Thumbprint -replace "\s", "").ToUpperInvariant()
          if ($thumbprint -cne $env:WINDOWS_SIGNING_THUMBPRINT) {
            throw "Built installer signer differs from the imported certificate."
          }
          $signtool = (Get-Command signtool.exe -ErrorAction Stop).Source
          & $signtool verify /pa /tw $installers[0].FullName
          if ($LASTEXITCODE -ne 0) { throw "signtool verification failed." }
          New-Item -ItemType Directory -Path "signed-assets" | Out-Null
          $version = (Get-Content "apps/desktop/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          $assetName = "Dada-Assistant_$($version)_${{ matrix.asset_architecture }}-setup.exe"
          Copy-Item -LiteralPath $installers[0].FullName -Destination (Join-Path "signed-assets" $assetName)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.artifact_prefix }}-${{ matrix.artifact_suffix }}
          path: signed-assets/*
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

      - name: 清理 Apple 签名材料
        if: ${{ always() && runner.os == 'macOS' }}
        shell: bash
        run: |
          set -euo pipefail
          keychain_path="$RUNNER_TEMP/dada-release-signing.keychain-db"
          original_keychains="$RUNNER_TEMP/dada-release-original-keychains.txt"
          original_default_keychain="$RUNNER_TEMP/dada-release-original-default-keychain.txt"
          if [ -f "$original_keychains" ]; then
            keychains=()
            while IFS= read -r keychain; do
              keychain=$(printf '%s' "$keychain" | tr -d '"' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')
              [ -z "$keychain" ] || keychains+=("$keychain")
            done < "$original_keychains"
            [ "${#keychains[@]}" -eq 0 ] || security list-keychains -d user -s "${keychains[@]}"
          fi
          if [ -f "$original_default_keychain" ]; then
            original_default=$(tr -d '"' < "$original_default_keychain" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//' | head -n 1)
            [ -z "$original_default" ] || security default-keychain -d user -s "$original_default"
          fi
          [ ! -f "$keychain_path" ] || security delete-keychain "$keychain_path"
          rm -f "$RUNNER_TEMP/dada-release-certificate.p12" "$RUNNER_TEMP/AuthKey_"*.p8 \
            "$original_keychains" "$original_default_keychain"

      - name: 清理 Windows 签名材料
        if: ${{ always() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $releaseConfig = Join-Path $env:GITHUB_WORKSPACE "apps/desktop/src-tauri/tauri.release.windows.conf.json"
          Remove-Item -LiteralPath $releaseConfig -Force -ErrorAction SilentlyContinue
          if ($env:WINDOWS_SIGNING_THUMBPRINT) {
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$env:WINDOWS_SIGNING_THUMBPRINT" -Force -ErrorAction SilentlyContinue
          }
