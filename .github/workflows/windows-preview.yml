name: 哒哒助手 v1.0 Windows ARM64 预览

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: dada-assistant-windows-arm64-preview

      - run: pnpm install --frozen-lockfile

      - name: Build Windows ARM64 installer
        shell: pwsh
        env:
          DADAAPI_ROUTE_MANIFEST_URLS: https://gitee.com/lyq_power/dadaapi-routes/raw/main/public/manifest.json,https://raw.githubusercontent.com/Tbthr/dadaapi-routes/main/public/manifest.json
          DADAAPI_ROUTE_PUBLIC_KEY_PEM: ${{ secrets.DADAAPI_ROUTE_PUBLIC_KEY_PEM }}
          DADAAPI_ROUTE_KEY_B64: ${{ secrets.DADAAPI_ROUTE_KEY_B64 }}
          DADAAPI_ROUTE_KEY_ID: v1
        run: pnpm --dir apps/desktop tauri build --target aarch64-pc-windows-msvc --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: dada-assistant-windows-arm64-preview
          path: target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
