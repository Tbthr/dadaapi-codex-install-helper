name: Windows ARM64 preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-arm64-preview

      - run: pnpm install --frozen-lockfile

      - name: Build Windows ARM64 installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WOCAO_HUB_ROUTE_MANIFEST_URL: https://raw.githubusercontent.com/ray7086/wocao-hub-routes/main/public/manifest.json
          WOCAO_HUB_ROUTE_PUBLIC_KEY_PEM: ${{ secrets.WOCAO_HUB_ROUTE_PUBLIC_KEY_PEM }}
          WOCAO_HUB_ROUTE_KEY_B64: ${{ secrets.WOCAO_HUB_ROUTE_KEY_B64 }}
          WOCAO_HUB_ROUTE_KEY_ID: v1
        run: pnpm --dir apps/desktop tauri build --target aarch64-pc-windows-msvc --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: wocao-hub-windows-arm64-preview
          path: target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
