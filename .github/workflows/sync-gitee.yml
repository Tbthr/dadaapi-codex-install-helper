name: 同步哒哒助手 v1.0 代码至 Gitee

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-gitee-main
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push main branch to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          git remote add gitee "https://lyq_power:${GITEE_TOKEN}@gitee.com/lyq_power/dadaapi-codex-install-helper.git"
          git push gitee HEAD:main
