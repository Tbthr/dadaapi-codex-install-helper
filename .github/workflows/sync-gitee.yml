name: 同步哒哒助手 v1.0 代码至 Gitee

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reset_repository:
        description: Replace Gitee main and delete all other branches, tags, and releases
        required: true
        default: false
        type: boolean
      confirmation:
        description: Type RESET GITEE REPOSITORY when reset_repository is enabled
        required: false
        type: string
      expected_remote_main:
        description: Exact current Gitee main SHA required for the reset lease
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sync-gitee-main
  cancel-in-progress: true

jobs:
  sync:
    environment: production-release
    runs-on: ubuntu-latest
    env:
      GITEE_REPOSITORY: ${{ vars.GITEE_REPOSITORY }}
      GITEE_USERNAME: ${{ vars.GITEE_USERNAME }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate Gitee mirror configuration
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GITEE_REPOSITORY" ]; then
            echo "::error title=Missing Gitee repository::Set the GITEE_REPOSITORY Actions variable to your Gitee owner/repository target."
            exit 1
          fi
          if ! [[ "$GITEE_REPOSITORY" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]]; then
            echo "::error title=Invalid Gitee repository::GITEE_REPOSITORY must use owner/repository format."
            exit 1
          fi
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::error title=Missing Gitee token::Add a GITEE_TOKEN Actions secret with write access to $GITEE_REPOSITORY."
            exit 1
          fi

      - name: Push main branch and missing immutable tags to Gitee
        if: github.event_name == 'push' || inputs.reset_repository == false
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          export GITEE_USERNAME="${GITEE_USERNAME:-${GITEE_REPOSITORY%%/*}}"
          askpass="$RUNNER_TEMP/dada-gitee-askpass.sh"
          umask 077
          cat > "$askpass" <<'EOF'
          #!/usr/bin/env sh
          case "$1" in
            *Username*) printf '%s\n' "$GITEE_USERNAME" ;;
            *) printf '%s\n' "$GITEE_TOKEN" ;;
          esac
          EOF
          chmod 700 "$askpass"
          trap 'rm -f "$askpass"' EXIT
          gitee_url="https://gitee.com/${GITEE_REPOSITORY}.git"
          remote_tags="$RUNNER_TEMP/dada-gitee-tags.tsv"
          listed=false
          for attempt in 1 2 3 4; do
            if GIT_ASKPASS="$askpass" GIT_ASKPASS_REQUIRE=force GIT_TERMINAL_PROMPT=0 \
              git ls-remote --tags "$gitee_url" 'refs/tags/v*' > "$remote_tags"; then
              listed=true
              break
            fi
            [ "$attempt" -eq 4 ] || sleep $((attempt * 5))
          done
          [ "$listed" = true ]

          refspecs=(HEAD:main)
          while IFS= read -r tag_ref; do
            local_object=$(git rev-parse --verify "$tag_ref")
            remote_object=$(awk -v ref="$tag_ref" '$2 == ref { print $1 }' "$remote_tags")
            if [ -n "$remote_object" ] && [ "$remote_object" != "$local_object" ]; then
              printf 'Refusing to overwrite different Gitee tag %s.\n' "$tag_ref" >&2
              exit 1
            fi
            if [ -z "$remote_object" ]; then
              refspecs+=("$tag_ref:$tag_ref")
            fi
          done < <(git for-each-ref --format='%(refname)' 'refs/tags/v*')

          GIT_ASKPASS="$askpass" GIT_ASKPASS_REQUIRE=force GIT_TERMINAL_PROMPT=0 git \
            push "$gitee_url" "${refspecs[@]}"

      - name: Reset Gitee repository to the single root commit
        if: github.event_name == 'workflow_dispatch' && inputs.reset_repository == true
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          RESET_CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_REMOTE_MAIN: ${{ inputs.expected_remote_main }}
        run: |
          set -euo pipefail
          test "$RESET_CONFIRMATION" = "RESET GITEE REPOSITORY"
          [[ "$EXPECTED_REMOTE_MAIN" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-list --count HEAD)" -eq 1
          test "$(git log -1 --format=%s)" = "init dadaapi install helper"

          export GITEE_USERNAME="${GITEE_USERNAME:-${GITEE_REPOSITORY%%/*}}"
          gitee_url="https://gitee.com/${GITEE_REPOSITORY}.git"
          authorization="Authorization: token $GITEE_TOKEN"
          askpass="$RUNNER_TEMP/dada-gitee-reset-askpass.sh"
          umask 077
          cat > "$askpass" <<'EOF'
          #!/usr/bin/env sh
          case "$1" in
            *Username*) printf '%s\n' "$GITEE_USERNAME" ;;
            *) printf '%s\n' "$GITEE_TOKEN" ;;
          esac
          EOF
          chmod 700 "$askpass"
          trap 'rm -f "$askpass"' EXIT

          remote_refs="$RUNNER_TEMP/dada-gitee-reset-refs.tsv"
          GIT_ASKPASS="$askpass" GIT_ASKPASS_REQUIRE=force GIT_TERMINAL_PROMPT=0 \
            git ls-remote --heads --tags "$gitee_url" > "$remote_refs"
          remote_main=$(awk '$2 == "refs/heads/main" { print $1 }' "$remote_refs")
          test "$remote_main" = "$EXPECTED_REMOTE_MAIN"

          releases="$RUNNER_TEMP/dada-gitee-reset-releases.json"
          release_status=$(curl -sS --connect-timeout 20 --max-time 60 \
            -o "$releases" \
            -w '%{http_code}' \
            -H "$authorization" \
            "https://gitee.com/api/v5/repos/$GITEE_REPOSITORY/releases?per_page=100")
          test "$release_status" = 200
          jq -e 'type == "array" and all(.[]; (.id | type == "number"))' "$releases" >/dev/null
          while IFS= read -r release_id; do
            [ -n "$release_id" ] || continue
            response="$RUNNER_TEMP/dada-gitee-reset-release-$release_id.json"
            status=$(curl -sS --connect-timeout 20 --max-time 60 \
              -o "$response" \
              -w '%{http_code}' \
              -X DELETE \
              -H "$authorization" \
              "https://gitee.com/api/v5/repos/$GITEE_REPOSITORY/releases/$release_id")
            if [ "$status" != 200 ] && [ "$status" != 204 ]; then
              printf 'Unable to delete Gitee release %s (HTTP %s).\n' "$release_id" "$status" >&2
              exit 1
            fi
          done < <(jq -r '.[].id' "$releases")

          delete_refspecs=()
          while IFS=$'\t' read -r _ ref; do
            case "$ref" in
              refs/heads/main|*'^{}') ;;
              refs/heads/*|refs/tags/*) delete_refspecs+=(":$ref") ;;
            esac
          done < "$remote_refs"
          if [ "${#delete_refspecs[@]}" -gt 0 ]; then
            GIT_ASKPASS="$askpass" GIT_ASKPASS_REQUIRE=force GIT_TERMINAL_PROMPT=0 git \
              push "$gitee_url" "${delete_refspecs[@]}"
          fi

          GIT_ASKPASS="$askpass" GIT_ASKPASS_REQUIRE=force GIT_TERMINAL_PROMPT=0 git \
            push --force-with-lease="refs/heads/main:$EXPECTED_REMOTE_MAIN" \
            "$gitee_url" HEAD:refs/heads/main

          verified_refs="$RUNNER_TEMP/dada-gitee-reset-verified.tsv"
          GIT_ASKPASS="$askpass" GIT_ASKPASS_REQUIRE=force GIT_TERMINAL_PROMPT=0 \
            git ls-remote --heads --tags "$gitee_url" > "$verified_refs"
          test "$(wc -l < "$verified_refs" | tr -d ' ')" -eq 1
          test "$(awk '$2 == "refs/heads/main" { print $1 }' "$verified_refs")" = "$GITHUB_SHA"

          curl -fsSL --connect-timeout 20 --max-time 60 \
            -H "$authorization" \
            "https://gitee.com/api/v5/repos/$GITEE_REPOSITORY/releases?per_page=100" \
            | jq -e 'length == 0' >/dev/null
