name: Release smoke test

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to test
        required: true
        default: v0.1.0

permissions:
  contents: read

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            architecture: x64
          - runner: windows-11-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Download released installer
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          $asset = "Wocao.Hub_$($env:RELEASE_TAG.TrimStart('v'))_$env:RELEASE_ARCHITECTURE-setup.exe"
          $url = "https://github.com/${{ github.repository }}/releases/download/$env:RELEASE_TAG/$asset"
          Invoke-WebRequest -Uri $url -OutFile installer.exe
          $signature = Get-AuthenticodeSignature installer.exe
          Write-Host "Installer Authenticode status: $($signature.Status)"

      - name: Install and launch released application
        shell: pwsh
        run: |
          $installer = Start-Process -FilePath "$PWD\installer.exe" -ArgumentList "/S" -Wait -PassThru
          if ($installer.ExitCode -ne 0) {
            throw "Installer exited with code $($installer.ExitCode)"
          }

          $roots = @($env:LOCALAPPDATA, $env:ProgramFiles, ${env:ProgramFiles(x86)}) |
            Where-Object { $_ -and (Test-Path $_) }
          $executable = $roots |
            ForEach-Object {
              Get-ChildItem -Path $_ -Filter "wocao-hub-desktop.exe" -File -Recurse -ErrorAction SilentlyContinue
            } |
            Select-Object -First 1
          if (-not $executable) {
            throw "Installed application executable was not found"
          }

          Write-Host "Launching $($executable.FullName)"
          $application = Start-Process -FilePath $executable.FullName -PassThru
          Start-Sleep -Seconds 15
          if ($application.HasExited) {
            Write-Host "Application exited with code $($application.ExitCode)"
            $logRoots = @(
              "$env:APPDATA\ai.wocao.hub",
              "$env:LOCALAPPDATA\ai.wocao.hub"
            )
            foreach ($root in $logRoots) {
              if (Test-Path $root) {
                Get-ChildItem -Path $root -File -Recurse -ErrorAction SilentlyContinue |
                  ForEach-Object {
                    Write-Host "--- $($_.FullName)"
                    Get-Content $_.FullName -Tail 100 -ErrorAction SilentlyContinue
                  }
              }
            }
            throw "Released application exited during startup smoke test"
          }

          Stop-Process -Id $application.Id -Force
          Write-Host "Released application remained alive for 15 seconds"
