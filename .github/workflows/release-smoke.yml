name: 哒哒助手 v1.0 发布冒烟

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to test
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - name: Download released macOS package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\")")
          test -n "$release"
          asset_id=$(printf '%s' "$release" | jq -r \
            '[.assets[] | select(.name | endswith("_universal.dmg"))] | if length == 1 then .[0].id else empty end')
          test -n "$asset_id"
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
            -H "Accept: application/octet-stream" > installer.dmg

      - name: Verify, install, and launch released macOS application
        shell: bash
        run: |
          set -euo pipefail
          mount_point="$RUNNER_TEMP/dada-assistant-release-mount"
          installed_app="$RUNNER_TEMP/哒哒助手.app"
          mkdir -p "$mount_point"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_point" installer.dmg
          trap 'hdiutil detach "$mount_point" >/dev/null 2>&1 || true' EXIT

          source_app=$(find "$mount_point" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$source_app"
          binary="$source_app/Contents/MacOS/dada-assistant-desktop"
          archs=$(lipo -archs "$binary")
          [[ " $archs " == *" arm64 "* ]]
          [[ " $archs " == *" x86_64 "* ]]
          codesign --verify --deep --strict "$source_app"

          ditto "$source_app" "$installed_app"
          codesign --verify --deep --strict "$installed_app"
          "$installed_app/Contents/MacOS/dada-assistant-desktop" >"$RUNNER_TEMP/dada-assistant.log" 2>&1 &
          application_pid=$!
          sleep 15
          kill -0 "$application_pid"
          kill "$application_pid"
          wait "$application_pid" || true

  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            architecture: x64
          - runner: windows-11-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: 下载已发布安装包
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          $suffix = "_$($env:RELEASE_ARCHITECTURE)-setup.exe"
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          $release = $releases | Where-Object { $_.tag_name -eq $env:RELEASE_TAG } | Select-Object -First 1
          if (-not $release) {
            throw "Release $env:RELEASE_TAG was not found"
          }
          $releaseAssets = @($release.assets | Where-Object { $_.name.EndsWith($suffix) })
          if ($releaseAssets.Count -ne 1) {
            throw "Expected one Windows $env:RELEASE_ARCHITECTURE installer, found $($releaseAssets.Count)"
          }
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/octet-stream"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          Invoke-WebRequest -Uri $releaseAssets[0].url -Headers $headers -OutFile installer.exe
          $signature = Get-AuthenticodeSignature installer.exe
          Write-Host "Installer Authenticode status: $($signature.Status)"

      - name: 安装并启动已发布应用
        shell: pwsh
        run: |
          $installer = Start-Process -FilePath "$PWD\installer.exe" -ArgumentList "/S" -Wait -PassThru
          if ($installer.ExitCode -ne 0) {
            throw "Installer exited with code $($installer.ExitCode)"
          }

          $roots = @($env:LOCALAPPDATA, $env:ProgramFiles, ${env:ProgramFiles(x86)}) |
            Where-Object { $_ -and (Test-Path $_) }
          $executables = @(
            $roots |
              ForEach-Object {
                Get-ChildItem -Path $_ -Filter "dada-assistant-desktop.exe" -File -Recurse -ErrorAction SilentlyContinue
              }
          )
          $executable = $executables | Select-Object -First 1
          if (-not $executable) {
            throw "Installed Dada Assistant executable was not found"
          }

          Write-Host "Launching $($executable.FullName)"
          $application = Start-Process -FilePath $executable.FullName -PassThru
          Start-Sleep -Seconds 15
          if ($application.HasExited) {
            throw "Released Dada Assistant exited during startup smoke test"
          }

          Stop-Process -Id $application.Id -Force
          Write-Host "哒哒助手 remained alive for 15 seconds"
