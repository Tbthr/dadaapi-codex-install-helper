name: 必需 CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: required-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 完整质量门禁
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt,clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: required-ci

      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: pnpm --dir apps/desktop check
      - run: pnpm --dir apps/desktop build
      - run: pnpm --dir apps/desktop format:check
      - run: bash scripts/check-licenses.sh

  macos-installer:
    name: macOS 安装脚本契约
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: /bin/sh -n scripts/install.sh
      - run: /bin/sh -n scripts/tests/install-sh-tests.sh
      - run: /bin/sh scripts/tests/install-sh-tests.sh
      - run: bash -n scripts/release/publish-gitee-release.sh
      - run: bash -n scripts/release/prune-old-releases.sh
      - run: bash scripts/tests/prune-old-releases-tests.sh
      - run: bash scripts/tests/gitee-api-tests.sh
      - run: bash scripts/tests/gitee-upload-tests.sh
      - run: bash scripts/tests/github-api-tests.sh

  windows-installer:
    name: Windows 安装脚本契约 (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            architecture: x64
          - runner: windows-11-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: PowerShell 语法检查
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $env:GITHUB_WORKSPACE "scripts/install.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $env:GITHUB_WORKSPACE "scripts/tests/install-ps1-tests.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }

      - name: PowerShell 单元测试
        shell: pwsh
        env:
          DADA_ASSISTANT_INSTALL_ARCH: ${{ matrix.architecture }}
        run: ./scripts/tests/install-ps1-tests.ps1
